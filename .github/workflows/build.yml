name: Build Extension

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: Publish a GitHub release (tag v<version from Cargo.toml> on this commit, run on main)
        type: boolean
        default: false

permissions:
  contents: read

env:
  IDENTIFIER: dev_xcrafttm_kanbanservers

jobs:
  package:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - id: version
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('Cargo.toml','rb'))['package']['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* && "v$version" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi
      - run: python3 scripts/package.py
      - uses: actions/upload-artifact@v7
        with:
          path: dist/${{ env.IDENTIFIER }}.c7s.zip
          archive: false
          if-no-files-found: error

  release:
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.release && github.ref == 'refs/heads/main')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Release notes from CHANGELOG.md
        env:
          version: ${{ needs.package.outputs.version }}
        run: |
          awk -v v="$version" '/^## \[/ { if (found) exit; if (index($0, "[" v "]")) { found = 1; next } } found' CHANGELOG.md > release-notes.md
          [ -s release-notes.md ] || { echo "::error::CHANGELOG.md has no section for $version"; exit 1; }
      # rebuilt here on purpose: download-artifact would unzip the .c7s.zip
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python3 scripts/package.py
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.package.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Kanban Servers v${{ needs.package.outputs.version }}
          body_path: release-notes.md
          files: dist/${{ env.IDENTIFIER }}.c7s.zip
          fail_on_unmatched_files: true
